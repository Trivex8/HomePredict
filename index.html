<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111522"><link rel="manifest" href="manifest.json"><title>HomePredict</title><style>*{box-sizing:border-box}body{background:#111522;color:#eef1ff;font:16px system-ui;margin:auto;max-width:680px;padding:20px}section,article{background:#20283a;border-radius:18px;padding:18px;margin:12px 0}button,input,select{background:#303d59;color:white;border:1px solid #52617e;border-radius:10px;padding:12px;font:inherit}input,select{width:100%;color-scheme:dark}label{display:block;margin:12px 0 4px}button{margin:4px;cursor:pointer}nav{display:flex;flex-wrap:wrap}nav button{flex:1}small,p{color:#b8c3da}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #52617e;text-align:right}[hidden]{display:none!important}</style><h1>⌂ HomePredict</h1><p>יומן משפחתי · שמירה מקומית</p><nav><button onclick="show('home')">בית</button><button onclick="show('report')">דיווח</button><button onclick="show('stats')">ממוצעים</button><button onclick="show('history')">היסטוריה</button></nav><section id="home"><h2>סיכום היום</h2><div id="cards"></div></section><section id="report" hidden><h2>דיווח</h2><label>תאריך</label><input type="date" id="date"><label>הורה</label><select id="parent"><option>אמא</option><option>אבא</option></select><label>מצב</label><select id="status"><option>עבודה</option><option>נשאר בבית</option><option>חופש</option><option>תקלה ברכב</option><option>יציאה אחרת</option><option>לא ידוע</option></select><div id="times"><label>יציאה</label><input type="time" id="out"><button onclick="now('out')">עכשיו</button><label>חזרה</label><input type="time" id="back"><button onclick="now('back')">עכשיו</button></div><label><input type="checkbox" id="consent" style="width:auto"> הדיווח בהסכמת ההורה</label><button onclick="save()">שמור דיווח</button><p id="msg"></p></section><section id="stats" hidden><h2>ממוצעים היסטוריים</h2><div id="weekly"></div></section><section id="history" hidden><h2>היסטוריה</h2><div id="records"></div></section><script>const $=x=>document.getElementById(x),parents=['אמא','אבא'],days=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];let data={};try{data=JSON.parse(localStorage.getItem('homepredict')||'{}')}catch{}function today(){let d=new Date;return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function key(){return $('date').value+'_'+$('parent').value}function show(id){for(let x of ['home','report','stats','history'])$(x).hidden=x!==id;render()}function load(){let r=data[key()];$('status').value=r?.status||'עבודה';$('out').value=r?.out||'';$('back').value=r?.back||'';$('consent').checked=false;toggle()}function toggle(){$('times').hidden=!['עבודה','יציאה אחרת'].includes($('status').value)}function now(id){let d=new Date;if($('date').value!==today()){ $('date').value=today();load()}$(id).value=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}function save(){let date=$('date').value,parent=$('parent').value,status=$('status').value,active=!$('times').hidden,out=active?$('out').value:'',back=active?$('back').value:'';if(!date||date>today()||!$('consent').checked||(active&&!out&&!back)||(out&&back&&back<out)){$('msg').textContent='בדוק שעות, תאריך והסכמה';return}data[key()]={date,parent,status,out,back};persist();$('msg').textContent='נשמר'}function persist(){localStorage.setItem('homepredict',JSON.stringify(data));render()}function edit(k){let r=data[k];$('date').value=r.date;$('parent').value=r.parent;load();show('report')}function add(p){$('date').value=today();$('parent').value=p;load();show('report')}function del(k){if(confirm('למחוק דיווח?')){delete data[k];persist()}}function avg(a){if(!a.length)return '—';let n=Math.round(a.reduce((s,t)=>s+Number(t.slice(0,2))*60+Number(t.slice(3)),0)/a.length);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function render(){$('cards').innerHTML=parents.map(p=>{let r=data[today()+'_'+p];return '<article><h2>'+p+'</h2><p>'+(r?.status||'אין דיווח')+'</p><p>יציאה: '+(r?.out||'—')+' | חזרה: '+(r?.back||'—')+'</p><button onclick="add(\''+p+'\')">עדכן דיווח</button></article>'}).join('');$('weekly').innerHTML=parents.map(p=>'<h3>'+p+'</h3><table><tr><th>יום</th><th>יציאה</th><th>חזרה</th></tr>'+days.map((d,i)=>{let a=Object.values(data).filter(r=>r.parent===p&&r.status==='עבודה'&&new Date(r.date+'T12:00').getDay()===i);return '<tr><td>'+d+'</td><td>'+avg(a.map(r=>r.out).filter(Boolean))+'</td><td>'+avg(a.map(r=>r.back).filter(Boolean))+'</td></tr>'}).join('')+'</table>').join('');$('records').innerHTML=Object.keys(data).sort().reverse().map(k=>{let r=data[k];return '<article>'+r.date+' · '+r.parent+'<p>'+r.status+' · '+r.out+' / '+r.back+'</p><button onclick="edit(\''+k+'\')">ערוך</button><button onclick="del(\''+k+'\')">מחק</button></article>'}).join('')||'אין דיווחים'}$('date').value=$('date').max=today();$('date').onchange=$('parent').onchange=load;$('status').onchange=toggle;load();render();</script></html>
